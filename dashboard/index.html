<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRANSBOT SE // GROUND CONTROL</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- E-stop flash overlay -->
  <div id="estop-banner" class="hidden">E-STOP &mdash; ZERO TWIST SENT</div>

  <header>
    <div class="brand">
      <span class="brand-mark">&#9650;</span>
      <h1>TRANSBOT SE <span class="dim">// GROUND CONTROL</span></h1>
    </div>
    <div class="header-right">
      <label class="profile">
        NET
        <select id="profile-select"></select>
      </label>
      <code id="rosbridge-url" class="dim"></code>
      <div class="link-status">
        <span id="link-lamp" class="lamp" data-status="disconnected"></span>
        <span id="link-text">LINK DOWN</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Video pane -->
    <section class="panel video-panel" aria-label="camera">
      <div class="panel-title">CAMERA</div>
      <div class="video-frame">
        <img id="video-stream" class="hidden" alt="robot camera stream">
        <div id="video-nosignal">
          <span>NO SIGNAL</span>
        </div>
      </div>
    </section>

    <!-- Telemetry rail -->
    <aside class="rail">

      <section id="drive-panel" class="panel" aria-label="drive">
        <div class="panel-title">DRIVE</div>
        <div class="metric-grid">
          <div class="metric">
            <span class="metric-label">CMD LIN <span class="unit">m/s</span></span>
            <span class="metric-value" id="cmd-linear">0.00</span>
            <div class="bar"><div class="bar-fill cmd" id="cmd-linear-bar"></div></div>
          </div>
          <div class="metric">
            <span class="metric-label">MEAS LIN <span class="unit">m/s</span></span>
            <span class="metric-value" id="meas-linear">--</span>
            <div class="bar"><div class="bar-fill meas" id="meas-linear-bar"></div></div>
          </div>
          <div class="metric">
            <span class="metric-label">CMD ANG <span class="unit">rad/s</span></span>
            <span class="metric-value" id="cmd-angular">0.00</span>
            <div class="bar"><div class="bar-fill cmd" id="cmd-angular-bar"></div></div>
          </div>
          <div class="metric">
            <span class="metric-label">MEAS ANG <span class="unit">rad/s</span></span>
            <span class="metric-value" id="meas-angular">--</span>
            <div class="bar"><div class="bar-fill meas" id="meas-angular-bar"></div></div>
          </div>
        </div>
      </section>

      <section id="power-panel" class="panel" aria-label="power">
        <div class="panel-title">POWER</div>
        <div class="power-row">
          <span class="metric-value big" id="battery-voltage">--</span>
          <span class="unit">V</span>
          <span id="battery-warning" class="warning hidden">LOW BATTERY</span>
        </div>
        <div class="bar"><div class="bar-fill batt" id="battery-bar"></div></div>
      </section>

      <section id="imu-panel" class="panel" aria-label="imu">
        <div class="panel-title">IMU</div>
        <table class="data-table">
          <tr><th></th><th>X</th><th>Y</th><th>Z</th></tr>
          <tr><th>ACC</th><td id="imu-ax">--</td><td id="imu-ay">--</td><td id="imu-az">--</td></tr>
          <tr><th>GYR</th><td id="imu-gx">--</td><td id="imu-gy">--</td><td id="imu-gz">--</td></tr>
        </table>
      </section>

      <section id="gimbal-panel" class="panel" aria-label="gimbal">
        <div class="panel-title">GIMBAL</div>
        <!-- min/max/step are filled from config.js at boot — no values here -->
        <div class="ctl">
          <div class="ctl-head">
            <span class="ctl-label">PAN</span>
            <input type="number" id="gimbal-x-num" class="ctl-num">
            <span class="unit">&deg;</span>
          </div>
          <input type="range" id="gimbal-x-slider" class="ctl-slider">
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <span class="ctl-label">TILT</span>
            <input type="number" id="gimbal-y-num" class="ctl-num">
            <span class="unit">&deg;</span>
          </div>
          <input type="range" id="gimbal-y-slider" class="ctl-slider">
        </div>
      </section>

      <section id="arm-panel" class="panel" aria-label="arm">
        <div class="panel-title">ARM</div>
        <div class="ctl">
          <div class="ctl-head">
            <span class="ctl-label">J7</span>
            <input type="number" id="arm-j7-num" class="ctl-num">
            <span class="unit">&deg;</span>
          </div>
          <input type="range" id="arm-j7-slider" class="ctl-slider">
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <span class="ctl-label">J8</span>
            <input type="number" id="arm-j8-num" class="ctl-num">
            <span class="unit">&deg;</span>
          </div>
          <input type="range" id="arm-j8-slider" class="ctl-slider">
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <span class="ctl-label">J9 &middot; GRIP</span>
            <input type="number" id="arm-j9-num" class="ctl-num">
            <span class="unit">&deg;</span>
          </div>
          <input type="range" id="arm-j9-slider" class="ctl-slider">
        </div>
        <div class="kv stacked"><span>CURRENT (svc)</span><code id="arm-current" class="dim small">--</code></div>
      </section>

    </aside>
  </main>

  <footer>
    <div id="legend"></div>
  </footer>

  <!-- roslib is vendored locally so the dashboard works offline (hotspot mode). -->
  <script src="lib/roslib.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
